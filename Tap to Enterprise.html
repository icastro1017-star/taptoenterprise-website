<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tap to Enterprise — Build once. Grow forever.</title>
<meta name="description" content="The FORMA Method helps small business owners formalize, organize and automate their company. Build once. Grow forever."/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@1,6..72,400;1,6..72,500&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<style>
/* responsive */
@media (max-width: 920px){
  .nav-links{display:none}
  .nav-burger{display:grid !important}
  .nav-cta{display:none}
  .hero-grid{grid-template-columns:1fr !important}
  .hero-visual{order:-1;max-width:520px}
  .about-grid{grid-template-columns:1fr !important}
  .contact-grid{grid-template-columns:1fr !important}
  .core-grid{grid-template-columns:repeat(2,1fr) !important}
  .ala-grid{grid-template-columns:repeat(2,1fr) !important}
  .perks-grid{grid-template-columns:1fr !important}
  .forma-detail{grid-template-columns:1fr !important;text-align:left}
}
@media (max-width: 560px){
  .core-grid,.ala-grid{grid-template-columns:1fr !important}
  .forma-track{grid-template-columns:repeat(5,1fr) !important;gap:6px !important}
  .forma-stone{padding:12px 8px !important;transform:none !important}
  .hero-stats{gap:18px !important}
}
.forma-detail{transition:opacity .3s ease, transform .3s ease}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="content.js"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="ui.jsx"></script>
<script type="text/babel" src="forma.jsx"></script>
<script type="text/babel" src="sections.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
